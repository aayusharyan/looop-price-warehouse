# Open weekly PRs when Python packages, GitHub Actions, or the base image change.
version: 2
updates:
  # Reads pyproject.toml at the repository root, including optional extras.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  # Covers actions used by every workflow under .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Tracks the python:3.12-slim tags in the root Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
