# Run the published collector daily and commit whatever changed under data and
# raw-cache, including raw responses the collector pruned or refreshed. After
# collection, refresh the README warehouse-size badge from the first area dir.
name: Collect daily prices

on:
  schedule:
    # Cron is always UTC and Japan is UTC+9 all year. Looop publishes tomorrow's
    # prices "around 16:00" JST without committing to a minute, so collect at
    # 16:15 JST and again at 17:15 JST in case the first run is late or skipped.
    - cron: "15 7 * * *"
    - cron: "15 8 * * *"
  workflow_dispatch:

concurrency:
  group: daily-price-collection
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out warehouse
        uses: actions/checkout@v7

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Exit code 2 means already published prices were corrected. The corrected
      # files are on disk, so the job continues to the commit and fails later.
      - name: Collect into the repository
        id: collect
        run: |
          docker pull "ghcr.io/${GITHUB_REPOSITORY}:latest"
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env JSON_DATA_DIR=/app/data \
            --env RAW_CACHE_DIR=/app/raw-cache \
            --volume "$PWD/data:/app/data" \
            --volume "$PWD/raw-cache:/app/raw-cache" \
            "ghcr.io/${GITHUB_REPOSITORY}:latest" collect --fail-on-correction
          collect_status=$?
          set -e
          echo "status=${collect_status}" >> "$GITHUB_OUTPUT"
          if [ "$collect_status" -ne 0 ] && [ "$collect_status" -ne 2 ]; then
            exit "$collect_status"
          fi

      - name: Commit changed warehouse files
        run: |
          git config user.name "Aayush Sinha"
          git config user.email "hello@yush.dev"
          git add --all data raw-cache
          if git diff --cached --quiet; then
            echo "The source data is unchanged."
            exit 0
          fi
          git commit -m "data: collect prices for $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Fail when published prices were corrected
        if: steps.collect.outputs.status == '2'
        run: |
          echo "::error::Prices already published for an earlier date changed." \
            "The files were updated and committed; review the collection log."
          exit 1

  # Count JSON files in the first area directory and rewrite the warehouse-size
  # badge. Runs after collect even when that job failed on a correction, because
  # those files were already committed. Checkout uses the branch name so this
  # clone includes the collect job's push rather than the workflow's start SHA.
  update-days-badge:
    needs: collect
    if: ${{ !cancelled() && (success() || failure()) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out warehouse
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Update warehouse size badge
        run: |
          area_dir=$(find data -maxdepth 1 -type d -name 'area-*' | sort | head -n 1)
          if [ -z "$area_dir" ]; then
            echo "No area directory found."
            exit 0
          fi
          days=$(find "$area_dir" -maxdepth 1 -name '*.json' | wc -l | tr -d ' ')
          echo "Counted ${days} day files in ${area_dir}."
          sed -i -E "s#(img.shields.io/badge/Warehouse%20Size-)[0-9]+(%20days-informational)#\\1${days}\\2#" README.md
          git config user.name "Aayush Sinha"
          git config user.email "hello@yush.dev"
          git add README.md
          if git diff --cached --quiet; then
            echo "The warehouse size badge is unchanged."
            exit 0
          fi
          git commit -m "docs: set warehouse size badge to ${days} days"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

