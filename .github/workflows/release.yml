# Create a semantic release and publish multi-platform images to both registries.
name: Create Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - minor
          - major
        default: minor

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          latest_tag=$(git tag --list "v*.*.*" --sort=-version:refname | awk 'NR==1')
          latest_tag=${latest_tag:-v0.0.0}
          IFS=. read -r major minor _ <<< "${latest_tag#v}"
          case "${{ inputs.version_bump }}" in
            major) major=$((major + 1)); minor=0 ;;
            minor) minor=$((minor + 1)) ;;
          esac
          echo "tag=v${major}.${minor}.0" >> "$GITHUB_OUTPUT"
          echo "version=${major}.${minor}.0" >> "$GITHUB_OUTPUT"
          echo "major=${major}" >> "$GITHUB_OUTPUT"
          echo "minor=${major}.${minor}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${latest_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,postgres]"
          pytest

      # Bump before the image is built so the image labels, the tagged commit and the
      # package metadata all report the same version, and so the build needs no
      # version arguments. The commit stays local until the build succeeds, so a
      # failed run leaves the branch alone.
      - name: Bump version in source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version_file=src/looop_price_collector/__init__.py
          dockerfile=docker/Dockerfile
          sed -i "s/^__version__ = .*/__version__ = \"${VERSION}\"/" "$version_file"
          # Matches both the plain and the OCI version label, since each ends with
          # version="x.y.z". Anchoring on the digits avoids touching any other label.
          sed -i -E "s/version=\"[0-9]+\.[0-9]+\.[0-9]+\"/version=\"${VERSION}\"/g" "$dockerfile"
          # sed reports success even when nothing matched, so confirm the new
          # value is really in the files rather than shipping a stale version.
          if ! grep --quiet --line-regexp "__version__ = \"${VERSION}\"" "$version_file"; then
            echo "Failed to set __version__ to ${VERSION} in ${version_file}" >&2
            exit 1
          fi
          label_count=$(grep --count "version=\"${VERSION}\"" "$dockerfile")
          if [ "$label_count" -ne 2 ]; then
            echo "Expected 2 version labels at ${VERSION} in ${dockerfile}, found ${label_count}" >&2
            exit 1
          fi
          git config user.name "Aayush Sinha"
          git config user.email "hello@yush.dev"
          git add "$version_file" "$dockerfile"
          if git diff --cached --quiet; then
            echo "Sources already at ${VERSION}"
          else
            git commit --message "Bump version to ${VERSION}"
          fi

      - name: Set up emulation
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ vars.DOCKERHUB_USERNAME }}/looop-price-warehouse
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=v${{ steps.version.outputs.minor }}
            type=raw,value=v${{ steps.version.outputs.major }}
          # These labels are passed to the build as --label, which overrides the
          # Dockerfile. Without pinning the version the action would derive it
          # from the first tag above and label every release "latest".
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and publish images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Publish the bump only once the images exist, so every tag on the branch
      # corresponds to images that were actually pushed.
      - name: Push bump, tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Repeated here so the tagger is set explicitly rather than depending on
          # the bump step having run first.
          git config user.name "Aayush Sinha"
          git config user.email "hello@yush.dev"
          git push origin "HEAD:refs/heads/$BRANCH"
          git tag --annotate "$TAG" --message "Release $TAG"
          git push origin "$TAG"
          if git rev-parse "$PREVIOUS_TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes \
              --notes-start-tag "$PREVIOUS_TAG"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
