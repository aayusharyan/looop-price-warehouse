# Python package, dependency, test, and command-line metadata.
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "looop-price-warehouse"
version = "0.1.0"
description = "Warehouse collector for Looop Denki electricity price data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aayush Sinha" }]
dependencies = [
  "httpx>=0.27,<1",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8,<9"]

[project.scripts]
looop-collector = "looop_price_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["looop_price_collector*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["src/tests"]
