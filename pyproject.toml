# Python package, dependency, test, and command-line metadata.
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "looop-price-warehouse"
description = "Warehouse collector for Looop Denki electricity price data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aayush Sinha" }]
dependencies = [
  "httpx>=0.27,<1",
  "SQLAlchemy>=2.0,<3",
]
dynamic = ["version"]

# Releases only bump major or minor, so the patch component stays 0. The single
# source of truth is __version__, which the release workflow rewrites and commits
# before building the image.
[tool.setuptools.dynamic]
version = { attr = "looop_price_collector.__version__" }

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
looop-price-collector = "looop_price_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["looop_price_collector*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["src/tests"]
